<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Perbarui Gapura Smart</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; background: #e9eeeb; color: #19372d; margin: 0; padding: 24px; }
    main { max-width: 480px; margin: 12vh auto; background: white; padding: 24px; border-radius: 16px; }
    button { font: inherit; background: #0f3c2a; color: white; padding: 12px 20px; border: 0; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: .6; } a { color: #0f3c2a; }
  </style>
</head>
<body>
  <main>
    <h1>Perbarui Gapura Smart</h1>
    <p>Muat versi aplikasi dan daftar SOP terbaru. Checklist yang tersimpan tetap dipertahankan.</p>
    <button id="update" type="button">Muat versi terbaru</button>
    <p id="status" role="status">Pastikan server atau koneksi internet tersedia.</p>
    <a href="./">Kembali ke aplikasi</a>
  </main>
  <script>
    const button = document.getElementById('update');
    const status = document.getElementById('status');
    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = 'Mengunduh pembaruan…';
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
        await registration.update();
        const installing = registration.installing;
        if (installing) await new Promise((resolve, reject) => {
          const check = () => {
            if (installing.state === 'installed' || installing.state === 'activated') resolve();
            if (installing.state === 'redundant') reject(new Error('Pembaruan gagal diunduh.'));
          };
          installing.addEventListener('statechange', check);
          check();
        });
        if (registration.waiting) {
          status.textContent = 'Mengaktifkan versi terbaru…';
          navigator.serviceWorker.addEventListener('controllerchange', () => location.replace('./'), { once: true });
          registration.waiting.postMessage({ type: 'ACTIVATE_UPDATE' });
        } else {
          location.replace('./');
        }
      } catch {
        status.textContent = 'Pembaruan belum berhasil. Pastikan server atau internet tersedia, lalu coba lagi.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
